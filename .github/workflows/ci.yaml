name: CI

on:
  push:
    branches:
      - v4
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      # Includes the two security regression tests:
      #   quartz/util/sanitize.test.ts builds the fixture pages in
      #     quartz/util/fixtures/sanitize and fails if any of their payloads reach
      #     the emitted HTML.
      #   quartz/cli/handlers.test.ts runs the preview server against the fixture
      #     site in quartz/cli/fixtures/serve and fails if it binds anything other
      #     than loopback, or if a request path that escapes the output directory is
      #     answered instead of refused.
      - name: Run tests
        run: npm test
